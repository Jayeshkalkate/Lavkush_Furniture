{% extends "header.html" %}
{% load static %}

{% block title %}Server Error – Lavkush Furniture{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <i class="fas fa-exclamation-triangle fa-5x text-danger mb-4"></i>
            <h1 class="display-4 fw-bold" style="color: #2c3e50;">500</h1>
            <h2 class="mb-4">Something Went Wrong</h2>
            <p class="text-muted">We're sorry, but an unexpected error occurred. Please try again later.</p>
            <a href="{% url 'homepage' %}" class="btn btn-warning mt-3">
                <i class="fas fa-home me-2"></i> Go Home
            </a>
        </div>
    </div>
</div>
{% endblock %}
